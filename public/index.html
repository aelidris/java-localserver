<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Local Server - Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #334155;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 1.5rem;
        }

        .btn {
            background-color: #334155;
            color: #f8fafc;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #475569;
            transition: all 0.2s ease;
            display: inline-block;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0284c7;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: #0284c7;
            border-color: #38bdf8;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🚀 Java NIO Server Dashboard</h1>
        <p>Test all server responses and error pages instantly below:</p>

        <div class="grid">
            <!-- 200 OK -->
            <a href="/" class="btn btn-success">200 OK (Home)</a>

            <!-- 403 Forbidden (Directory) -->
            <a href="/images" class="btn" target="_blank">403 Forbidden</a>

            <!-- 404 Not Found -->
            <a href="/random-page-test" class="btn" target="_blank">404 Not Found</a>

            <!-- 405 Method Not Allowed -->
            <button class="btn" onclick="test405()">405 Method Not Allowed</button>

            <!-- 413 Payload Too Large -->
            <button class="btn" onclick="testPayload()">413 Payload Too Large</button>

            <!-- 500 Internal Server Error -->
            <button class="btn" onclick="test500()">500 Server Error</button>
        </div>

        <!-- Test Upload & Delete Workflow -->
        <div style="margin: 15px 0;">
            <button class="btn" onclick="testUploadAndDelete()" style="background-color: #28a745; color: white;">
                🧪 Test Upload (POST) & Delete Flow
            </button>
            <p id="delete-test-result" style="margin-top: 5px; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        function testPost() {
            fetch('/', { method: 'POST' })
                .then(res => res.text().then(html => {
                    document.open();
                    document.write(html);
                    document.close();
                }));
        }

        function testPayload() {
            alert('To test 413, use curl or send a huge POST body via script/Postman as configured in config.json.');
        }

        function test500() {
            alert('To test 500 Internal Server Error, trigger an unhandled exception in your Java server code (e.g. throwing a RuntimeException inside a request handler) or handle a server-side crash scenario.');
        }

        function test405() {
            fetch('/', {
                method: 'PUT'
            })
                .then(response => response.text())
                .then(html => {
                    let win = window.open();
                    win.document.write(html);
                    win.document.close();
                })
                .catch(err => console.error(err));
        }

        async function testUploadAndDelete() {
            const resultElement = document.getElementById('delete-test-result');
            resultElement.innerText = "⏳ Step 1: Uploading/Creating test file via POST...";
            resultElement.style.color = "orange";

            try {
                // POST request
                let postResponse = await fetch('/uploads/test-file.txt', {
                    method: 'POST',
                    body: 'Hello, this is a test file for deletion audit.'
                });

                if (postResponse.ok || postResponse.status === 200 || postResponse.status === 201) {
                    resultElement.innerText = "✅ Step 1 Success: File created. Now deleting via DELETE...";
                    resultElement.style.color = "blue";

                    await new Promise(resolve => setTimeout(resolve, 1000));

                    // DELETE request
                    let deleteResponse = await fetch('/uploads/test-file.txt', {
                        method: 'DELETE'
                    });

                    if (deleteResponse.ok) {
                        let msg = await deleteResponse.text();
                        resultElement.innerText = "🎉 Success! File uploaded and then deleted successfully. (" + msg + ")";
                        resultElement.style.color = "green";
                    } else {
                        resultElement.innerText = "❌ Delete failed with status: " + deleteResponse.status;
                        resultElement.style.color = "red";
                    }

                } else {
                    resultElement.innerText = "❌ POST/Upload failed with status: " + postResponse.status;
                    resultElement.style.color = "red";
                }

            } catch (error) {
                console.error(error);
                resultElement.innerText = "⚠️ Error during test execution: " + error.message;
                resultElement.style.color = "red";
            }
        }
    </script>
</body>

</html>
