<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Local Server - Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #334155;
            max-width: 650px;
            width: 100%;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        h2 {
            color: #f1f5f9;
            font-size: 1.1rem;
            margin-top: 1.5rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 1rem;
        }

        .btn {
            background-color: #334155;
            color: #f8fafc;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #475569;
            transition: all 0.2s ease;
            display: inline-block;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0284c7;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: #0284c7;
            border-color: #38bdf8;
            grid-column: 1 / -1;
        }

        .btn-cgi {
            background-color: #8b5cf6;
            border-color: #a78bfa;
        }

        .btn-cgi:hover {
            background-color: #7c3aed;
        }

        .result-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            word-break: break-all;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🚀 Java NIO Server Dashboard</h1>
        <p>Test all HTTP status codes, CGI scripts, and Session/Cookies below:</p>

        <h2>📌 Status Responses</h2>
        <div class="grid">
            <a href="/" class="btn btn-success">200 OK (Home)</a>
            <a href="/images" class="btn" target="_blank">403 Forbidden</a>
            <a href="/random-page-test" class="btn" target="_blank">404 Not Found</a>
            <button class="btn" onclick="test405()">405 Method Not Allowed</button>
            <button class="btn" onclick="testPayload()">413 Payload Too Large</button>
            <button class="btn" onclick="test500()">500 Server Error</button>
        </div>

        <h2>🐍 CGI & Session/Cookie Testing</h2>
        <div class="grid">
            <button class="btn btn-cgi" onclick="testCGI('GET')">Test CGI (GET)</button>
            <button class="btn btn-cgi" onclick="testCGI('POST')">Test CGI (POST)</button>
            <button class="btn" onclick="checkCookies()">Check Cookies</button>
        </div>
        <div id="cgi-result" class="result-box" style="display: none;"></div>

        <h2>📂 Upload & Delete Workflow</h2>
        <div style="margin-top: 10px;">
            <button class="btn" onclick="testUploadAndDelete()" style="background-color: #10b981; border-color: #34d399;">
                🧪 Test Upload (POST) & Delete Flow
            </button>
            <p id="delete-test-result" style="margin-top: 8px; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        function test405() {
            fetch('/', { method: 'PUT' })
                .then(response => response.text())
                .then(html => {
                    let win = window.open();
                    win.document.write(html);
                    win.document.close();
                })
                .catch(err => console.error(err));
        }

        function testPayload() {
            alert('To test 413, use curl or send a large body via script as configured in config.json.');
        }

        function test500() {
            alert('To test 500 Internal Server Error, trigger an exception on the server.');
        }

        async function testCGI(method) {
            const box = document.getElementById('cgi-result');
            box.style.display = 'block';
            box.innerText = `⏳ Executing Python CGI via ${method}...`;

            try {
                let options = { method: method };
                let url = '/test.py';
                if (method === 'POST') {
                    options.body = 'message=HelloFromDashboard';
                }

                let response = await fetch(url, options);
                let text = await response.text();
                box.innerText = `Response:\n` + text;
            } catch (err) {
                box.innerText = `❌ CGI Error: ` + err.message;
            }
        }

        function checkCookies() {
            const box = document.getElementById('cgi-result');
            box.style.display = 'block';
            box.innerText = `🍪 Current Browser Cookies:\n` + (document.cookie || "No cookies set yet.");
        }

        async function testUploadAndDelete() {
            const resultElement = document.getElementById('delete-test-result');
            resultElement.innerText = "⏳ Step 1: Uploading file via POST...";
            resultElement.style.color = "orange";

            try {
                let postResponse = await fetch('/uploads/test-file.txt', {
                    method: 'POST',
                    body: 'Hello, this is a test file for deletion audit.'
                });

                if (postResponse.ok || postResponse.status === 200 || postResponse.status === 201) {
                    resultElement.innerText = "✅ Step 1 Success! Now deleting via DELETE...";
                    resultElement.style.color = "#38bdf8";

                    await new Promise(resolve => setTimeout(resolve, 1000));

                    let deleteResponse = await fetch('/uploads/test-file.txt', { method: 'DELETE' });

                    if (deleteResponse.ok) {
                        let msg = await deleteResponse.text();
                        resultElement.innerText = "🎉 Success! Uploaded and Deleted: (" + msg + ")";
                        resultElement.style.color = "#34d399";
                    } else {
                        resultElement.innerText = "❌ Delete failed with status: " + deleteResponse.status;
                        resultElement.style.color = "#f87171";
                    }
                } else {
                    resultElement.innerText = "❌ POST/Upload failed with status: " + postResponse.status;
                    resultElement.style.color = "#f87171";
                }
            } catch (error) {
                resultElement.innerText = "⚠️ Error: " + error.message;
                resultElement.style.color = "#f87171";
            }
        }
    </script>
</body>

</html>
